<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Site</h1>
    <p>Photos and videos I want to share.</p>
  </header>

  <main>
    <section id="photos">
      <h2>Photos</h2>
      <div class="gallery">
        <img src="photos/photo1.jpeg" alt="Description of photo 1">
        <img src="photos/photo2.jpeg" alt="Description of photo 2">
        <img src="photos/photo3.jpeg" alt="Description of photo 3">
      </div>
    </section>

    <section id="videos">
      <h2>Videos</h2>
      <div class="video-grid">
        <a class="video-wrapper" href="https://www.youtube.com/watch?v=xkBt4E5O1TE" target="_blank" rel="noopener">
          <img src="https://img.youtube.com/vi/xkBt4E5O1TE/hqdefault.jpg" alt="YouTube video thumbnail">
          <span class="play-button">&#9658;</span>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Site</p>
  </footer>

</body>
</html>
